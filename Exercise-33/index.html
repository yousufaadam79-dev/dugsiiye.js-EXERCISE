<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Practice Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 24px;
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .cards-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .client-card {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .client-info h3 {
      font-size: 16px;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background-color: #ef444420;
      color: #f87171;
      font-weight: 600;
    }

    /* Standard Paid class */
    .status-badge.paid {
      background-color: #22c55e20;
      color: #4ade80;
    }

    .btn-action {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: 0.2s;
    }

    .btn-action:hover {
      background-color: #0369a1;
    }

    .global-controls {
      display: flex;
      gap: 10px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }

    .btn-global {
      flex: 1;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.2s;
    }

    .btn-global:hover {
      background-color: #475569;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 id="main-title">Diiwaanka Macaamiisha</h1>
      <p id="sub-title">Isticmaal JavaScript si aad xogta u beddesho</p>
    </div>

    <!-- CARDS-KA MACAAMIISHA -->
    <div class="cards-wrapper">
      
      <div class="client-card">
        <div class="client-info">
          <h3 class="client-name">Ustaad Hamuuda</h3>
          <span id="status_one" class="status-badge">Haraa: $150</span>
        </div>
        <button onclick="change3()" class="btn-action">Bixi Deynta</button>
      </div>

      <div class="client-card">
        <div class="client-info">
          <h3 class="client-name">Omar Tood</h3>
          <span  id="status_two"  class="status-badge">Haraa: $300</span>
        </div>
        <button onclick="change1()" class="btn-action">Bixi Deynta</button>
      </div>

      <div class="client-card">
        <div class="client-info">
          <h3 class="client-name">Yousuf Aadan</h3>
          <span id="status_three"  class="status-badge">Haraa: $450</span>
        </div>
        <button onclick="change2()" class="btn-action">Bixi Deynta</button>
      </div>

    </div>

    <!-- BATOONADA GUUD -->
    <div class="global-controls">
      <button id="change-title-btn" class="btn-global">Beddel background-color</button>
      <button id="clear-all-btn" class="btn-global">Bixi Dhamaan Deymaha</button>
    </div>
  </div>

  <script src="./main.js"></script>

</body>
</html>
